server:
  shutdown: "graceful"
  compression:
    enabled: true
    min-response-size: 2048
  port: 8080

spring:
  lifecycle:
    timeout-per-shutdown-phase: "5s"
  output:
    ansi:
      enabled: "always"
  jackson:
    serialization:
      indent_output: true
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: "jdbc:h2:mem:test;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;\
DB_CLOSE_ON_EXIT=FALSE;schema=public"
    username: sa
    password:
    driverClassName: org.h2.Driver
  jpa:
    #    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    open-in-view: true
  h2:
    console:
      enabled: true
      path: /h2
      settings:
        trace: false
        web-allow-others: true
  liquibase:
    enabled: true
    changelog: config/liquibase/master.yaml
    contexts: ddl,static,system,test
    user: sa
    password:
    default-schema: public
    liquibase-schema: public
  thymeleaf:
    cache: false

hibernate:
  hbm2ddl:
    auto: none

management:
  server:
    port: 8081
  endpoints:
    enabled-by-default: true
    web:
      base-path: "/manage"
      exposure:
        include: "*"
    jmx:
      exposure:
        include: "*"
  endpoint:
    env:
      show-values: always
    configprops:
      show-values: always

logging:
  group:
    bluegecko: "uk.co.bluegecko"
    noise: "org.apache,
      org.springframework,
      javax.management,
      com.zaxxer.hikari,
      tech.units.indriya,
      org.springdoc"
    database: "org.hibernate,
      org.hibernate.SQL,
      org.hibernate.orm.jdbc.bind,
      org.hibernate.stat,
      org.hibernate.SQL_SLOW,
      org.hibernate.cache,
      com.zaxxer.hikari,
      liquibase"
    logger: "ch.qos.logback"
    problems: "io.opentelemetry"
  level:
    root: "info"
    bluegecko: "debug"
    noise: "info"
    database: "info"
    logger: "warn"
    problems: "trace"
    web: "info"

otel:
  config:
    file: "../env/otel-config.yaml"

app:
  name: "${name}"
  description: "${description}"
  version: "${version}"